<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0e27">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>بارکد ساین</title>
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e27;--card:#111638;--accent:#00d4ff;--accent2:#7c4dff;--danger:#ff4757;--success:#00e676;--text:#e8eaff;--text2:#9598c7}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;direction:rtl}
.header{background:linear-gradient(135deg,#111638,#1a1f45);padding:20px 16px;text-align:center;border-bottom:2px solid var(--accent);position:sticky;top:0;z-index:10}
.header h1{font-size:1.4rem;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header .sub{font-size:0.8rem;color:var(--text2);margin-top:4px}
.container{max-width:500px;margin:0 auto;padding:16px}
.stats{display:flex;gap:10px;margin-bottom:16px}
.stat-card{flex:1;background:var(--card);border-radius:14px;padding:14px;text-align:center;border:1px solid rgba(255,255,255,.06)}
.stat-card .num{font-size:1.8rem;font-weight:800;color:var(--accent)}
.stat-card .lbl{font-size:0.7rem;color:var(--text2);margin-top:2px}
.form-card{background:var(--card);border-radius:14px;padding:18px;margin-bottom:16px;border:1px solid rgba(255,255,255,.06)}
.form-card h2{font-size:1rem;color:var(--accent);margin-bottom:14px}
.ig{margin-bottom:10px}
.ig label{display:block;font-size:0.75rem;color:var(--text2);margin-bottom:4px}
.ig input,.ig select{width:100%;padding:12px 14px;border:2px solid rgba(255,255,255,.1);border-radius:10px;background:rgba(255,255,255,.04);color:var(--text);font-size:0.95rem;direction:rtl;font-family:inherit}
.ig input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 12px rgba(0,212,255,.2)}
.ig input::placeholder{color:rgba(255,255,255,.25)}
.row{display:flex;gap:10px}.row .ig{flex:1}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border:none;border-radius:12px;font-size:0.95rem;font-weight:700;cursor:pointer;width:100%;transition:all .2s;font-family:inherit}
.btn:active{transform:scale(.96)}
.btn-p{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 15px rgba(0,212,255,.3)}
.btn-s{background:var(--accent2);color:#fff;box-shadow:0 4px 12px rgba(124,77,255,.3)}
.btn-d{background:var(--danger);color:#fff}
.btn-sm{padding:8px 14px;font-size:0.8rem;width:auto;border-radius:8px}
.search{position:relative;margin-bottom:12px}
.search input{width:100%;padding:12px 14px 12px 38px;border:2px solid rgba(255,255,255,.1);border-radius:10px;background:var(--card);color:var(--text);font-size:0.95rem;direction:rtl;font-family:inherit}
.search input:focus{outline:none;border-color:var(--accent)}
.search::after{content:'🔍';position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:0.85rem}
.plist{margin-top:12px}
.pitem{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.06)}
.pinfo{flex:1;min-width:0}
.pname{font-weight:700;font-size:0.95rem}
.pmeta{font-size:0.7rem;color:var(--text2);display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.pmeta span{background:rgba(255,255,255,.05);padding:1px 6px;border-radius:4px}
.pacts{display:flex;gap:6px;flex-shrink:0}
.ib{width:38px;height:38px;border:none;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;color:#fff;transition:all .2s}
.ib.barcode{background:linear-gradient(135deg,#00d4ff,#0091ea)}
.ib.qr{background:linear-gradient(135deg,#00e676,#00c853)}
.ib.edit{background:linear-gradient(135deg,#ffab00,#ff6d00)}
.ib.del{background:linear-gradient(135deg,#ff5252,#d50000)}
.ib:active{transform:scale(.85)}
.empty{text-align:center;padding:40px 20px;color:var(--text2)}
.empty .ico{font-size:3rem;margin-bottom:10px;opacity:.4}
.modal-ov{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:100;justify-content:center;align-items:center;padding:16px;backdrop-filter:blur(4px)}
.modal-ov.active{display:flex}
.modal{background:var(--card);border-radius:14px;padding:20px;width:100%;max-width:380px;text-align:center;border:1px solid rgba(255,255,255,.1);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal h3{margin-bottom:16px;color:var(--accent);font-size:1.1rem}
.modal canvas,.modal svg{max-width:100%;background:#fff;border-radius:10px;padding:12px;margin-bottom:12px}
.modal .mlabel{font-size:0.8rem;color:var(--text2);margin-bottom:14px}
.macts{display:flex;gap:8px;justify-content:center}
.macts .btn{flex:1}
#barcodeOutput,#qrOutput{display:flex;justify-content:center;min-height:80px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:10px 24px;border-radius:24px;font-size:0.85rem;font-weight:600;z-index:200;transition:transform .3s;box-shadow:0 6px 20px rgba(0,212,255,.4)}
.toast.show{transform:translateX(-50%) translateY(0)}
.offbadge{position:fixed;top:8px;left:8px;background:var(--success);color:#000;padding:4px 10px;border-radius:12px;font-size:0.7rem;font-weight:700;z-index:200;display:none}
.offbadge.vis{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.pitem{animation:fadeIn .3s ease-out}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--accent);border-radius:3px}
@media(prefers-color-scheme:dark){body{background:var(--bg)}}
</style>
<script src="lib/JsBarcode.all.min.js"></script>
<script src="lib/qrcode.min.js"></script>
</head>
<body>
<div class="offbadge" id="offbadge">📡 آفلاین</div>
<div class="header"><h1>📊 بارکد ساین</h1><div class="sub">تولید بارکد و QR Code برای اجناس</div></div>
<div class="container">
<div class="stats"><div class="stat-card"><div class="num" id="stTotal">0</div><div class="lbl">اجناس</div></div><div class="stat-card"><div class="num" id="stCat">0</div><div class="lbl">دسته‌بندی</div></div></div>
<div class="form-card" id="formCard"><h2 id="formTitle">➕ افزودن جنس جدید</h2>
<div class="ig"><label>نام جنس</label><input type="text" id="fName" placeholder="مثال: آیفون ۱۵"></div>
<div class="row"><div class="ig"><label>قیمت (تومان)</label><input type="number" id="fPrice" placeholder="0"></div><div class="ig"><label>دسته‌بندی</label><input type="text" id="fCat" placeholder="مثال: موبایل"></div></div>
<div class="row"><div class="ig"><label>بارکد</label><input type="text" id="fBC" placeholder="خودکار"></div><div class="ig"><label>موجودی</label><input type="number" id="fStock" placeholder="0" value="0"></div></div>
<button class="btn btn-p" id="btnSave">💾 ذخیره</button>
<button class="btn btn-s" id="btnCancel" style="display:none;margin-top:8px">❌ انصراف</button>
</div>
<div class="search"><input type="text" id="fSearch" placeholder="🔍 جستجوی جنس..."></div>
<div class="plist" id="plist"></div>
</div>
<div class="modal-ov" id="barcodeModal"><div class="modal"><h3>📊 بارکد</h3><div id="barcodeOutput"></div><div class="mlabel" id="barcodeLabel"></div><div class="macts"><button class="btn btn-p btn-sm" id="btnDownloadBC">📥 دانلود</button><button class="btn btn-s btn-sm" id="btnPrintBC">🖨️ چاپ</button><button class="btn btn-sm" id="btnCloseBC" style="background:#333;color:#fff">✖️ بستن</button></div></div></div>
<div class="modal-ov" id="qrModal"><div class="modal"><h3>📱 QR Code</h3><div id="qrOutput"></div><div class="mlabel" id="qrLabel"></div><div class="macts"><button class="btn btn-p btn-sm" id="btnDownloadQR">📥 دانلود</button><button class="btn btn-sm" id="btnCloseQR" style="background:#333;color:#fff">✖️ بستن</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
var SK='sayn_products';
var products=[];
var editingId=null;
var currentBC=null,currentQR=null;
function $(s){return document.querySelector(s)}
function $$(s){return document.querySelectorAll(s)}
var els={fName:$('#fName'),fPrice:$('#fPrice'),fCat:$('#fCat'),fBC:$('#fBC'),fStock:$('#fStock'),fSearch:$('#fSearch'),formTitle:$('#formTitle'),btnSave:$('#btnSave'),btnCancel:$('#btnCancel'),plist:$('#plist'),stTotal:$('#stTotal'),stCat:$('#stCat'),toast:$('#toast'),offbadge:$('#offbadge'),barcodeModal:$('#barcodeModal'),barcodeOutput:$('#barcodeOutput'),barcodeLabel:$('#barcodeLabel'),btnDownloadBC:$('#btnDownloadBC'),btnPrintBC:$('#btnPrintBC'),btnCloseBC:$('#btnCloseBC'),qrModal:$('#qrModal'),qrOutput:$('#qrOutput'),qrLabel:$('#qrLabel'),btnDownloadQR:$('#btnDownloadQR'),btnCloseQR:$('#btnCloseQR')};

function load(){try{products=JSON.parse(localStorage.getItem(SK)||'[]')}catch(e){products=[]}}
function save(){localStorage.setItem(SK,JSON.stringify(products))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function bcgen(){return '2000'+Math.floor(Math.random()*100000000).toString().padStart(8,'0')}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function toast(m){els.toast.textContent=m;els.toast.classList.add('show');setTimeout(function(){els.toast.classList.remove('show')},2500)}
function init(){load();render();updStats();els.offbadge.classList.remove('vis');if(!navigator.onLine)els.offbadge.classList.add('vis');window.addEventListener('online',function(){els.offbadge.classList.remove('vis')});window.addEventListener('offline',function(){els.offbadge.classList.add('vis')})}

// Save
els.btnSave.addEventListener('click',function(){
var name=els.fName.value.trim();if(!name){toast('⚠️ نام جنس را وارد کنید');return}
var price=parseInt(els.fPrice.value)||0;var cat=els.fCat.value.trim();var bc=els.fBC.value.trim()||bcgen();var stock=parseInt(els.fStock.value)||0;
if(editingId){var idx=products.findIndex(function(p){return p.id===editingId});if(idx>=0)products[idx]={id:products[idx].id,name:name,price:price,category:cat,barcode:bc,stock:stock,updated:Date.now()};toast('✅ ویرایش شد');editingId=null;els.formTitle.textContent='➕ افزودن جنس جدید';els.btnCancel.style.display='none'}
else{products.push({id:uid(),name:name,price:price,category:cat,barcode:bc,stock:stock,created:Date.now(),updated:Date.now()});toast('✅ جنس اضافه شد')}
save();render();updStats();clearForm();
});
els.btnCancel.addEventListener('click',function(){editingId=null;clearForm();els.formTitle.textContent='➕ افزودن جنس جدید';els.btnCancel.style.display='none'});

function clearForm(){['fName','fPrice','fCat','fBC','fStock'].forEach(function(id){var el=document.getElementById(id);if(el)el.value=(id==='fStock')?'0':''})}
function editProduct(id){var p=products.find(function(x){return x.id===id});if(!p)return;editingId=id;els.fName.value=p.name;els.fPrice.value=p.price||'';els.fCat.value=p.category||'';els.fBC.value=p.barcode||'';els.fStock.value=p.stock||0;els.formTitle.textContent='✏️ ویرایش جنس';els.btnCancel.style.display='block';window.scrollTo({top:0,behavior:'smooth'})}
function deleteProduct(id){if(!confirm('آیا از حذف مطمئن هستید؟'))return;products=products.filter(function(p){return p.id!==id});save();render();updStats();toast('🗑️ حذف شد')}

// Render
function render(){
var q=(els.fSearch.value||'').toLowerCase();
var filtered=products.filter(function(p){return!q||p.name.toLowerCase().includes(q)||(p.category||'').toLowerCase().includes(q)||(p.barcode||'').includes(q)});
if(!filtered.length){els.plist.innerHTML='<div class="empty"><div class="ico">📦</div><div>'+(q?'نتیجه‌ای یافت نشد':'هنوز جنسی اضافه نشده')+'</div></div>';return}
els.plist.innerHTML=filtered.map(function(p){return '<div class="pitem"><div class="pinfo"><div class="pname">'+esc(p.name)+'</div><div class="pmeta">'+(p.price?'<span>💰 '+p.price.toLocaleString("fa")+' تومان</span>':'')+(p.category?'<span>📁 '+esc(p.category)+'</span>':'')+(p.stock?'<span>📦 '+p.stock+'</span>':'')+'</div></div><div class="pacts"><button class="ib barcode" data-action="barcode" data-id="'+p.id+'" title="بارکد">║</button><button class="ib qr" data-action="qr" data-id="'+p.id+'" title="QR">⊞</button><button class="ib edit" data-action="edit" data-id="'+p.id+'" title="ویرایش">✎</button><button class="ib del" data-action="del" data-id="'+p.id+'" title="حذف">✕</button></div></div>';}).join('')
}

els.plist.addEventListener('click',function(e){var btn=e.target.closest('[data-action]');if(!btn)return;var id=btn.getAttribute('data-id');var action=btn.getAttribute('data-action');if(action==='barcode')showBarcode(id);else if(action==='qr')showQR(id);else if(action==='edit')editProduct(id);else if(action==='del')deleteProduct(id)});

function updStats(){els.stTotal.textContent=products.length;var cats=new Set(products.map(function(p){return p.category}).filter(Boolean));els.stCat.textContent=cats.size}

// Barcode
function showBarcode(id){var p=products.find(function(x){return x.id===id});if(!p)return;currentBC=p;els.barcodeLabel.textContent=p.name+' | '+p.barcode;els.barcodeOutput.innerHTML='';var svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.id='bcSvg';els.barcodeOutput.appendChild(svg);try{JsBarcode(svg,p.barcode||bcgen(),{format:'CODE128',width:2,height:80,displayValue:true,fontSize:14,margin:8,background:'#ffffff',lineColor:'#000000'})}catch(e){els.barcodeOutput.innerHTML='<div style="color:var(--danger);padding:16px">خطا: '+e.message+'</div>'}els.barcodeModal.classList.add('active')}
els.btnCloseBC.addEventListener('click',function(){els.barcodeModal.classList.remove('active')});
els.barcodeModal.addEventListener('click',function(e){if(e.target===els.barcodeModal)els.barcodeModal.classList.remove('active')});

// QR
function showQR(id){var p=products.find(function(x){return x.id===id});if(!p)return;currentQR=p;els.qrLabel.textContent=p.name+' | '+(p.price?p.price.toLocaleString('fa')+' تومان':'');els.qrOutput.innerHTML='';var qrDiv=document.createElement('div');els.qrOutput.appendChild(qrDiv);try{new QRCode(qrDiv,{text:JSON.stringify({name:p.name,price:p.price,barcode:p.barcode,category:p.category}),width:200,height:200,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}catch(e){els.qrOutput.innerHTML='<div style="color:var(--danger);padding:16px">خطا: '+e.message+'</div>'}els.qrModal.classList.add('active')}
els.btnCloseQR.addEventListener('click',function(){els.qrModal.classList.remove('active')});
els.qrModal.addEventListener('click',function(e){if(e.target===els.qrModal)els.qrModal.classList.remove('active')});

// Download/Print
els.btnDownloadBC.addEventListener('click',function(){var svg=document.getElementById('bcSvg');if(!svg)return;var sd=new XMLSerializer().serializeToString(svg);var c=document.createElement('canvas');var ctx=c.getContext('2d');var img=new Image();img.onload=function(){c.width=img.width*2;c.height=img.height*2;ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);var a=document.createElement('a');a.download='barcode-'+(currentBC?currentBC.name:'unknown')+'.png';a.href=c.toDataURL('image/png');a.click();toast('📥 دانلود شد')};img.onerror=function(){toast('❌ خطا در دانلود')};img.src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(sd)))});
els.btnPrintBC.addEventListener('click',function(){var svg=document.getElementById('bcSvg');if(!svg)return;var sd=new XMLSerializer().serializeToString(svg);var w=window.open('','_blank');w.document.write('<html><head><title>چاپ بارکد</title></head><body style="text-align:center;padding:20px;font-family:sans-serif"><h3>'+(currentBC?currentBC.name:'')+'</h3>'+sd+'<p>'+(currentBC?currentBC.barcode:'')+'</p><script>onload=function(){print();close()}<\/script></body></html>');w.document.close()});
els.btnDownloadQR.addEventListener('click',function(){var img=els.qrOutput.querySelector('img');if(!img)return;var a=document.createElement('a');a.download='qr-'+(currentQR?currentQR.name:'unknown')+'.png';a.href=img.src;a.click();toast('📥 دانلود شد')});

// Search
els.fSearch.addEventListener('input',render);

// PWA Install
var deferredPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e});
document.addEventListener('click',function(e){if(e.target.closest('.install-btn')&&deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(function(c){if(c.outcome==='accepted')toast('✅ اپ نصب شد');deferredPrompt=null})}});

// Register SW
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').then(function(){console.log('SW ok')}).catch(function(e){console.log('SW err',e)})}

init();
})();
</script>
</body>
</html>
